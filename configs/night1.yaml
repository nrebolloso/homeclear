# Turlington Plaza (UF) at NIGHT (REAL, user 2026-10-24 05:08): ONE continuous 543 s take, Samsung 4K 60 fps HLG (data/night1.mp4).
# Brick planters, pavers, a railed stair, benches, street lights. ~2.2 frames/s as kitchen4/lounge -> 1200 frames, exhaustive
# (the walk loops). Risks: near-identical planters, wind-moved plants, dark sky. Scale ASSUMED until a known size is picked.
run_name: turlington
video: data/night1.mp4
work_dir: out/night1
frames:
  target: 1200
  min: 900
  max_side: 1600
colmap:
  matcher: exhaustive
  min_registered: 0.8
splat:
  steps: 7000
  test_every: 8
  min_psnr: 20.0
scale:
  manual_factor: null
  assume_camera_height_m: 1.4   # ASSUMED (no known size picked yet); stage 4 uses this before markers, so null it if markers are added
  marker_dict: DICT_4X4_50
  marker_id: 0
  marker_size_m: 0.1
  tolerance_pct: 3.0
  ground_truth: []
clean:
  min_opacity: 0.05
  max_scale_m: 0.5
  room_margin_m: 0.6
  below_floor_m: 0.15
  ceiling_m: 4.0
  floater_voxel_m: 0.05
  floater_min_neighbours: 8
floor:
  ransac_iters: 2000
  inlier_m: 0.02
  min_opacity: 0.1
  near_cameras_m: 2.0
  fit: walked   # 85 x 65 m plaza reconstructed 1.9 deg tilted: RANSAC took the flat west end (2.5% inliers), the east end sat 0.7-1.4 m under z=0 with no floor; bike check (wheelbase 1.77 m) said scale ~1.6x too big (2026-10-25)
grid:
  cell_m: 0.05   # outdoor plaza ~85 x 65 m: at 2 cm the 13.6M-cell grid x 1200 cameras stalls stage 12 coverage for hours (2026-10-25)
  min_opacity: 0.1
  floor_band_m: 0.15   # plaza ground after the walked fit still wanders +-10-15 cm over metres (by the bike +0.07..+0.13): a 1.5 cm band saw no floor there and 5 cm called it obstacle
  floor_close_cells: 4   # textureless floor, seen sparsely (fills gaps up to 40 cm at 5 cm cells)
  obstacle_z:   # from 20 cm (above the ground noise): kerbs and objects under 20 cm are NOT mapped in this scene
  - 0.2
  - 1.8
  bump_z:
  - 0.004
  - 0.05
  floor_local_m: 1.0
  thin:
    max_width_m: 0.08
    min_length_m: 0.3
    typical_height_m: 0.006
  min_count: 2
  speck: {max_cells: 1, min_span_m: 0.10, floor_gap_m: 0.15}   # mid-air floaters of ~3 Gaussians each would block the walker
  bump_link_cells: 1
  no_bumps: "outdoor plaza ground is +-10-15 cm noise after levelling, so 0.4-5 cm bumps can't be measured here"
  floor_walked_m: 0.25      # the floor under the walk is rarely filmed: the operator stood there (half a shoulder width)
  floor_min_opacity: 0.1   # 5b drops 57% of this night splat (faint, isolated): stage 12 rebuilt the grid with half the floor (241 vs 490 m2) and cut the route
plan:
  start: [5.9, 7.5]   # past the blue bike (triangulated hubs ~(5.9, 2.5), leaning on the planter's west side): walk the path beside it, north to south
  goal: [5.4, -2.0]
  walker_width_m: 0.61
  preferred_clearance_m: 0.3
  clearance_weight: 5.0
hazards:
  clearance_margin_m: 0.1
  bump_limit_m: 0.01
fix:
  backend: stub
  max_renders: 3
  camera_back_m: 1.5
  camera_height_m: 1.4
viewer:
  timeout_ms: 60000
cluster:
  ssh: hpg
  control_path: ~/.ssh/cm-hpg
  repo: $HPG_ROOT/Homeclear
  env: $HPG_ROOT/envs/homeclear
game:
  walker:                       # Drive Medical 10210-1 (Amazon B001HOM4U2): manufacturer spec sheet, not taped
    width_m: 0.61               # 24 in overall (keep = plan.walker_width_m)
    depth_m: 0.445              # 17.5 in (retailer listing; the spec sheet gives none)
    handle_height_m: 0.85       # adjusts 32-39 in (0.81-0.99 m): set to the patient
    user_gap_m: 0.25
    leg_radius_m: 0.0127        # 1 in aluminium tube
  persona:
    eye_height_m: 1.55
    gait_profile: older_adult_walker
    stride_m: 0.35
    stride_cv: 0.1
    foot_sep_m: 0.2
    toe_clearance_cv: 0.25
  risk:
    rollouts: 500
    trips_per_night: 2
    days_per_month: 30
    path_offset_sd_m: 0.05
    step_jitter_m: 0.04
    dark_contact_multiplier: 1.5
    ghosts: 24
    leg_flash_m: 0.01
    contact_table:
      older_adult_walker:
        # generated by tools/contact_table.py: Frontiers 2014: MTC 14.1 +- 8.3 mm (lognormal shape), ~1/578 strides contact a 1 cm obstacle (level); k = p(10 mm)/P(MTC<10 mm), trip-averaged with toe_clearance_cv
        height_m: [0, 0.0025, 0.005, 0.0075, 0.01, 0.0125, 0.015, 0.02, 0.03, 0.05]
        p_per_stride: [0, 8.71e-06, 0.000241, 0.000875, 0.00168, 0.00242, 0.00302, 0.00381, 0.00442, 0.00463]
  objects: []   # new scene: stage 6c detections / hand picks fill this after the splat
  interventions: []
