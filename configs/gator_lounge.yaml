# Lounge with the gator-head desk (REAL): ONE continuous 589 s take, Samsung 4K 60 fps HLG, same phone/format as kitchen4
# (data/gator_lounge.mp4). ~2.2 frames/s as kitchen4 -> 1300 frames, exhaustive as kitchen4. Polished (reflective) concrete.
# Scale: gator desk height ~18 in (user, rounded) + its outline from data/gator_desk_marker_ref.jpg (photo ESTIMATE).
run_name: newell_lounge1   # viewer scene newell_lounge1_lighter (was gator_lounge)
video: data/gator_lounge.mp4
work_dir: out/gator_lounge
frames:
  target: 1300
  min: 975
  max_side: 1600
colmap:
  matcher: exhaustive
  min_registered: 0.8
splat:
  steps: 7000
  test_every: 8
  min_psnr: 20.0
scale:
  manual_factor: null
  assume_camera_height_m: 1.4   # ASSUMED placeholder until the picks below are set (no marker in this video)
  # TODO after stage 2: desk-height pick (0.4572 m, rounded) cross-checked against the photo outline fit; both APPROXIMATE
  marker_dict: DICT_4X4_50
  marker_id: 0
  marker_size_m: 0.1
  tolerance_pct: 3.0
  ground_truth: []
clean:
  min_opacity: 0.05
  max_scale_m: 0.5
  room_margin_m: 0.6
  below_floor_m: 0.15
  ceiling_m: 4.0
  floater_voxel_m: 0.05
  floater_min_neighbours: 8
  lighter_drop_boxes:   # viewer-only: blue haze discs between sofa2's back and the railing/drop behind it (camera never went
  # there; removing sofa2 left them floating). Strip 5-90 cm out from its back edge; discs only, the railing's thin parts stay
  - {center: [0.576, -3.661, 0.875], size: [3.7, 0.85, 1.45], yaw_deg: 32, min_mid_scale_m: 0.03}
floor:
  ransac_iters: 2000
  inlier_m: 0.02
  min_opacity: 0.1
  near_cameras_m: 2.0
grid:
  cell_m: 0.02
  min_opacity: 0.1
  floor_band_m: 0.015
  floor_close_cells: 10   # textureless vinyl floor, seen sparsely (fills gaps up to 40 cm in observed floor)
  floor_min_opacity: 0.02   # the vinyl trained as faint Gaussians: solid-only floor left 60% of the walked path an invisible wall
  floor_walked_m: 0.25      # the floor under the walk is rarely filmed: the operator stood there (half a shoulder width)
  obstacle_z:
  - 0.05
  - 1.8
  bump_z:
  - 0.004
  - 0.05
  floor_local_m: 1.0
  thin:
    max_width_m: 0.08
    min_length_m: 0.3
    typical_height_m: 0.006
  min_count: 2
  speck: {max_cells: 6, min_span_m: 0.10, floor_gap_m: 0.15}   # mid-air floaters of ~3 Gaussians each would block the walker
  bump_link_cells: 3
  fixed:   # furniture 6c never detected: stays in the room splat, never offered to move/drop; only its outline came out solid,
  # so its inside read as open floor. Hand outlines (ESTIMATED, ~10 cm) from viewer renders + top-down height maps
  - {name: bench, kind: sofa, poly_xy: [[-1.6, 4.24], [-0.33, 4.91], [-0.69, 5.53], [-1.96, 4.84]]}   # grey bench behind stool2 (its edges at z 0.3-0.5, front face 10 cm out)
  - {name: conference_table, kind: table, poly_xy: [[1.5, 4.75], [1.9, 4.1], [2.25, 3.65], [2.6, 3.48], [3.0, 3.52], [3.45, 3.78], [3.62, 4.2], [3.5, 4.6], [2.9, 4.82], [2.2, 5.1]]}   # by chair3; top-edge arc
  - {name: booth, kind: sofa, poly_xy: [[-4.75, -0.68], [-3.0, 0.37], [-4.12, 2.22], [-5.87, 1.17]]}   # booth seats + table near rug2
plan:
  # start/goal unset: stage 7 picks two far-apart cells of the largest walker-reachable region (no bed or bathroom in this scene)
  walker_width_m: 0.61
  preferred_clearance_m: 0.3
  clearance_weight: 5.0
hazards:
  clearance_margin_m: 0.1
  bump_limit_m: 0.01
fix:
  backend: stub
  max_renders: 3
  camera_back_m: 1.5
  camera_height_m: 1.4
viewer:
  timeout_ms: 60000
cluster:
  ssh: hpg
  control_path: ~/.ssh/cm-hpg
  repo: $HPG_ROOT/Homeclear
  env: $HPG_ROOT/envs/homeclear
game:
  walker:                       # Drive Medical 10210-1 (Amazon B001HOM4U2): manufacturer spec sheet, not taped
    width_m: 0.61               # 24 in overall (keep = plan.walker_width_m)
    depth_m: 0.445              # 17.5 in (retailer listing; the spec sheet gives none)
    handle_height_m: 0.85       # adjusts 32-39 in (0.81-0.99 m): set to the patient
    user_gap_m: 0.25
    leg_radius_m: 0.0127        # 1 in aluminium tube
  persona:
    eye_height_m: 1.55
    gait_profile: older_adult_walker
    stride_m: 0.35
    stride_cv: 0.1
    foot_sep_m: 0.2
    toe_clearance_cv: 0.25
  risk:
    rollouts: 500
    trips_per_night: 2
    days_per_month: 30
    path_offset_sd_m: 0.05
    step_jitter_m: 0.04
    dark_contact_multiplier: 1.5
    ghosts: 24
    leg_flash_m: 0.01
    contact_table:
      older_adult_walker:
        # generated by tools/contact_table.py: Frontiers 2014: MTC 14.1 +- 8.3 mm (lognormal shape), ~1/578 strides contact a 1 cm obstacle (level); k = p(10 mm)/P(MTC<10 mm), trip-averaged with toe_clearance_cv
        height_m: [0, 0.0025, 0.005, 0.0075, 0.01, 0.0125, 0.015, 0.02, 0.03, 0.05]
        p_per_stride: [0, 8.71e-06, 0.000241, 0.000875, 0.00168, 0.00242, 0.00302, 0.00381, 0.00442, 0.00463]
  objects: []   # new scene: stage 6c detections / hand picks fill this after the splat
  interventions: []
