# Same take as configs/bedroom2.yaml, poses from GLOMAP global mapping (slurm/glomap.sbatch) on stage 2's features + matches:
# the incremental GPU mapper was cancelled by the system at 2h21m (1050/1165 placed); 30k splat from slurm/train_best.sbatch (out/bedroom2_glomap_best).
# Bedroom + bathroom (REAL), NOT the `bedroom` scene's room (user, 2026-10-24): ONE continuous 529.5 s take,
# iPhone 14 1080p 30 fps HEVC 10-bit HLG (+ Dolby Vision layer, ignored). ~2.2 frames/s as kitchen4 -> 1165 frames, exhaustive.
# Scale from the printed ArUco markers on the floor; size from the sheet's printed ruler (fit-to-page, see marker_size_m).
run_name: aleroom   # viewer scene aleroom_lighter (was bedroom2_glomap)
video: data/bedroom2.mov
work_dir: out/bedroom2_glomap
frames:
  target: 1165
  min: 870
  exclude_s: [[489, 492]]   # user: a hand is in frame for ~1 s at 8:10; +-1 s margin
  max_side: 1600
colmap:
  matcher: exhaustive
  min_registered: 0.8
splat:
  steps: 7000
  test_every: 8
  min_psnr: 20.0
scale:
  manual_factor: null
  marker_dict: DICT_4X4_50
  marker_id: [0, 1, 2]   # all three floor prints seen in the frames (id 0: 95, id 1: 47, id 2: 67 frames); scale = median, spread reported
  marker_size_m: 0.1425  # 150 mm sheets printed fit-to-page: the sheet's 100 mm ruler reads ~95 mm (user), so 0.95 x 150 mm (MEASURED via ruler, ~0.5 mm reading)
  tolerance_pct: 3.0
  ground_truth: []       # markers lie on the floor, so the marker-height check doesn't apply; stage 4 reports SKIP (unverified)
clean:
  min_opacity: 0.05
  max_scale_m: 0.5
  room_margin_m: 0.6
  below_floor_m: 0.15
  ceiling_m: 2.9
  floater_voxel_m: 0.05
  floater_min_neighbours: 8
  lighter_crop_m: 0.3   # viewer-only: blobs past the floor grid ringed the room from above
  lighter_air: {min_opacity: 0.4, max_scale_m: 0.04}   # viewer-only: faint/large haze above the floor band (nicoroom1 values)
floor:
  ransac_iters: 2000
  inlier_m: 0.02
  min_opacity: 0.1
  near_cameras_m: 2.0
grid:
  cell_m: 0.02
  min_opacity: 0.1
  floor_band_m: 0.015
  floor_close_cells: 10   # textureless vinyl floor, seen sparsely (fills gaps up to 40 cm in observed floor)
  obstacle_z:
  - 0.05
  - 1.8
  bump_z:
  - 0.004
  - 0.05
  floor_local_m: 1.0
  thin:
    max_width_m: 0.08
    min_length_m: 0.3
    typical_height_m: 0.006
  min_count: 2
  speck: {max_cells: 6, min_span_m: 0.10, floor_gap_m: 0.15}   # mid-air floaters of ~3 Gaussians each would block the walker
  bump_link_cells: 3
plan:
  # start/goal unset: stage 7 picks two far-apart cells of the largest walker-reachable region (set bed -> toilet once the splat exists)
  walker_width_m: 0.61
  preferred_clearance_m: 0.3
  clearance_weight: 5.0
hazards:
  clearance_margin_m: 0.1
  bump_limit_m: 0.01
fix:
  backend: stub
  max_renders: 3
  camera_back_m: 1.5
  camera_height_m: 1.4
viewer:
  timeout_ms: 60000
cluster:
  ssh: hpg
  control_path: ~/.ssh/cm-hpg
  repo: $HPG_ROOT/Homeclear
  env: $HPG_ROOT/envs/homeclear
game:
  walker:                       # Drive Medical 10210-1 (Amazon B001HOM4U2): manufacturer spec sheet, not taped
    width_m: 0.61               # 24 in overall (keep = plan.walker_width_m)
    depth_m: 0.445              # 17.5 in (retailer listing; the spec sheet gives none)
    handle_height_m: 0.85       # adjusts 32-39 in (0.81-0.99 m): set to the patient
    user_gap_m: 0.25
    leg_radius_m: 0.0127        # 1 in aluminium tube
  persona:
    eye_height_m: 1.55
    gait_profile: older_adult_walker
    stride_m: 0.35
    stride_cv: 0.1
    foot_sep_m: 0.2
    toe_clearance_cv: 0.25
  risk:
    rollouts: 500
    trips_per_night: 2
    days_per_month: 30
    path_offset_sd_m: 0.05
    step_jitter_m: 0.04
    dark_contact_multiplier: 1.5
    ghosts: 24
    leg_flash_m: 0.01
    contact_table:
      older_adult_walker:
        # generated by tools/contact_table.py: Frontiers 2014: MTC 14.1 +- 8.3 mm (lognormal shape), ~1/578 strides contact a 1 cm obstacle (level); k = p(10 mm)/P(MTC<10 mm), trip-averaged with toe_clearance_cv
        height_m: [0, 0.0025, 0.005, 0.0075, 0.01, 0.0125, 0.015, 0.02, 0.03, 0.05]
        p_per_stride: [0, 8.71e-06, 0.000241, 0.000875, 0.00168, 0.00242, 0.00302, 0.00381, 0.00442, 0.00463]
  objects: []   # new scene: stage 6c detections / hand picks fill this after the splat
  merge_into: {bedside_table2: bed}   # 6c saw the bed's headboard as a bedside table (user, 2026-10-25)
  interventions: []
