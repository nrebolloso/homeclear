# kitchen4 apartment, kitchen + table + open-riser stairs + upstairs loft/bathroom (REAL, user 2026-10-25 01:13): ONE continuous
# 1129 s take, 4K 59 fps (data/kitchen5.mp4 = ~/Downloads/20261025_002130.mp4). 2000 frames (~1.8 frames/s as bedbath_hall),
# exhaustive (the walk revisits rooms). Same yellow chairs/table as kitchen4: this is the take with the stairs filmed.
run_name: kitchen5
video: data/kitchen5.mp4
work_dir: out/kitchen5
frames:
  target: 2000
  min: 1500
  max_side: 1600
colmap:
  matcher: exhaustive
  min_registered: 0.8
splat:
  steps: 7000
  test_every: 8
  min_psnr: 20.0
scale:
  manual_factor: null
  assume_camera_height_m: 1.4   # ASSUMED: no printed markers seen in the sampled frames
  marker_dict: DICT_4X4_50
  marker_id: 0
  marker_size_m: 0.1
  tolerance_pct: 3.0
  ground_truth: []
clean:
  min_opacity: 0.05
  max_scale_m: 0.5
  room_margin_m: 0.6
  below_floor_m: 4.0   # 2 floors: stage 5 may pick the loft as "floor", so keep the ground floor below it
  ceiling_m: 6.0      # 2 floors at ~3 m floor-to-floor (ASSUMED) + headroom
  floater_voxel_m: 0.05
  floater_min_neighbours: 8
  lighter_camera_clear_m: 0.4   # viewer-only: fog along the phone path; 0.6 ate the blinds wall the phone passed close to
  lighter_crop_m: 0.3   # viewer-only: blobs past the floor grid ringed the room from above
  lighter_air: {min_opacity: 0.15, max_scale_m: 0.08}   # viewer-only: faint/large haze above the floor band; 0.4 / 4 cm stripped the blinds
floor:
  ransac_iters: 2000
  inlier_m: 0.02
  min_opacity: 0.1
  near_cameras_m: 2.0
grid:
  cell_m: 0.02
  min_opacity: 0.1
  floor_band_m: 0.015
  floor_close_cells: 10   # as bedroom2 (fills gaps up to 40 cm in observed floor)
  obstacle_z:
  - 0.05
  - 1.8
  bump_z:
  - 0.004
  - 0.05
  floor_local_m: 1.0
  thin:
    max_width_m: 0.08
    min_length_m: 0.3
    typical_height_m: 0.006
  min_count: 2
  speck: {max_cells: 6, min_span_m: 0.10, floor_gap_m: 0.15}   # mid-air floaters of ~3 Gaussians each would block the walker
  bump_link_cells: 3
plan:
  # start/goal unset: stage 7 picks two far-apart cells of the largest walker-reachable region (set table -> foot of the stairs once the splat exists)
  walker_width_m: 0.61
  preferred_clearance_m: 0.3
  clearance_weight: 5.0
hazards:
  clearance_margin_m: 0.1
  bump_limit_m: 0.01
fix:
  backend: stub
  max_renders: 3
  camera_back_m: 1.5
  camera_height_m: 1.4
viewer:
  timeout_ms: 60000
cluster:
  ssh: hpg
  control_path: ~/.ssh/cm-hpg
  repo: $HPG_ROOT/Homeclear
  env: $HPG_ROOT/envs/homeclear
game:
  walker:                       # Drive Medical 10210-1 (Amazon B001HOM4U2): manufacturer spec sheet, not taped
    width_m: 0.61               # 24 in overall (keep = plan.walker_width_m)
    depth_m: 0.445              # 17.5 in (retailer listing; the spec sheet gives none)
    handle_height_m: 0.85       # adjusts 32-39 in (0.81-0.99 m): set to the patient
    user_gap_m: 0.25
    leg_radius_m: 0.0127        # 1 in aluminium tube
  persona:
    eye_height_m: 1.55
    gait_profile: older_adult_walker
    stride_m: 0.35
    stride_cv: 0.1
    foot_sep_m: 0.2
    toe_clearance_cv: 0.25
  risk:
    rollouts: 500
    trips_per_night: 2
    days_per_month: 30
    path_offset_sd_m: 0.05
    step_jitter_m: 0.04
    dark_contact_multiplier: 1.5
    ghosts: 24
    leg_flash_m: 0.01
    contact_table:
      older_adult_walker:
        # generated by tools/contact_table.py: Frontiers 2014: MTC 14.1 +- 8.3 mm (lognormal shape), ~1/578 strides contact a 1 cm obstacle (level); k = p(10 mm)/P(MTC<10 mm), trip-averaged with toe_clearance_cv
        height_m: [0, 0.0025, 0.005, 0.0075, 0.01, 0.0125, 0.015, 0.02, 0.03, 0.05]
        p_per_stride: [0, 8.71e-06, 0.000241, 0.000875, 0.00168, 0.00242, 0.00302, 0.00381, 0.00442, 0.00463]
  objects: []   # new scene: stage 6c detections / hand picks fill this after the splat
  interventions: []
